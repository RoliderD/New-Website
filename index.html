<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daniel Rolider | Photojournalist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500&family=Inter:wght@400;500&family=Frank+Ruhl+Libre:wght@300;400&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f3;--ink:#161616;--mute:#6f6e6a;--line:#dedcd6;--p1:#e7e5e0;--p2:#dedcd6;--p3:#ece9e4;
--sans:Inter,Heebo,system-ui,sans-serif;--serif:Newsreader,"Frank Ruhl Libre",Georgia,serif;--pad:clamp(20px,5vw,72px);--gap:clamp(56px,9vw,120px);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--ink:#ecebe7;--mute:#9a9994;--line:#2a2a2a;--p1:#1d1d1d;--p2:#191919;--p3:#222}}
:root[data-theme="dark"]{--bg:#121212;--ink:#ecebe7;--mute:#9a9994;--line:#2a2a2a;--p1:#1d1d1d;--p2:#191919;--p3:#222}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.65 var(--sans);overflow-x:clip;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit;text-decoration:none;transition:color .25s,opacity .25s}
a:focus-visible,button:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:45;background:var(--bg)}
.lgm{display:none}
.bar,main,footer{max-width:1360px;margin:0 auto;padding-inline:var(--pad)}
.bar{display:flex;gap:8px 28px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:18px}
.logo{font-weight:500;font-size:13px;letter-spacing:.04em}
.r{flex:1;display:flex;gap:8px 28px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:4px 26px;flex-wrap:wrap}
nav a{font-size:12.5px;color:var(--mute);padding:6px 0;display:inline-block}
nav a:hover,nav a[aria-current]{color:var(--ink)}
#lg,#mb{font:inherit;font-size:12.5px;background:none;border:0;padding:6px 0;color:var(--mute);cursor:pointer;transition:color .25s}
#lg:hover,#mb:hover{color:var(--ink)}
#mb{display:none}
main{padding-top:clamp(40px,7vw,88px);padding-bottom:var(--gap)}
.meta{display:flex;gap:6px 18px;flex-wrap:wrap;margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
html[dir=rtl] .meta{letter-spacing:.02em;text-transform:none;font-size:12px}
.back{margin-bottom:28px}
h1{font:300 clamp(32px,4.6vw,56px)/1.1 var(--serif);letter-spacing:-.015em;margin:14px 0 22px}
html[dir=rtl] h1{letter-spacing:0}
.intro{font:400 clamp(18px,1.7vw,21px)/1.6 var(--serif);max-width:54ch;margin:0 0 var(--gap);opacity:.88}
.intro a{border-bottom:1px solid var(--line)}
.ph{background:var(--p1);color:var(--mute);font-size:11px;letter-spacing:.1em;display:flex;align-items:flex-end;padding:12px;width:100%}
.pic{margin:0}
.pic img,.hf img,.tile img{display:block;width:100%;height:auto;transition:opacity .4s}
.pic:hover img,.hf:hover img,.tile:hover img{opacity:.93}
.bleed{width:100vw;margin-inline:calc(50% - 50vw)}
.gal{display:grid;gap:var(--gap)}
.row{margin-inline:auto}
.row.full{width:min(100%,calc(100svh*var(--r)))}
.row.mid{width:min(calc(100% - 2*var(--pad)),1000px,calc(100svh*var(--r)))}
.row.one{width:min(calc(100% - 2*var(--pad)),520px,calc(100svh*var(--r)))}
.row.pair{width:min(calc(100% - 2*var(--pad)),1180px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2.5vw,32px);align-items:center}
#gal [data-i]{cursor:zoom-in}
.feed{display:grid;grid-template-columns:repeat(12,1fr);column-gap:clamp(16px,3vw,48px);row-gap:var(--gap);align-items:start}
.hf{display:block;grid-column:1/-1;justify-self:center;width:100%;max-width:calc(100svh*var(--r))}
.hf.s1{grid-column:1/8;justify-self:start}
.hf.s2{grid-column:8/-1;justify-self:end;align-self:end}
.hf.s3{grid-column:3/11}
.hf.s4{grid-column:1/6;justify-self:start}
.hf.s5{grid-column:6/-1;justify-self:end;align-self:center}
.hf.s6{grid-column:4/-1;justify-self:end}
.hf.s7{grid-column:1/8;justify-self:start}
.hf.s8{grid-column:8/-1;justify-self:end;align-self:end}
.im{display:block;position:relative;overflow:hidden}
.hf .im img{transition:transform .8s cubic-bezier(.2,.6,.2,1),opacity .4s}
.tile img{object-fit:cover}
.cap{display:flex;flex-direction:column;gap:6px;padding-top:14px}
.cap b{font-weight:400;font-size:14px;transition:color .25s}
.tile:hover .cap b{color:var(--mute)}
@media (hover:hover){
.hf .cap{position:absolute;inset-inline:0;bottom:0;padding:56px 20px 18px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s}
.hf .cap .meta{color:rgba(255,255,255,.78)}
.hf:hover .cap,.hf:focus-visible .cap{opacity:1;transform:none}
.hf:hover .im img{transform:scale(1.015)}
}
@media (max-width:700px){.feed{grid-template-columns:1fr;row-gap:60px}.hf{grid-column:auto!important;align-self:auto!important;justify-self:stretch!important;max-width:none!important;pointer-events:none;cursor:default}.hf .cap{display:none}.hf .im img{aspect-ratio:3/2;object-fit:cover;height:auto}.hf .ph{aspect-ratio:3/2!important}}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(48px,7vw,96px) clamp(20px,3vw,40px)}
@media (max-width:700px){.tiles{grid-template-columns:1fr}}
.tile{display:block}
.cols{columns:3 260px;column-gap:clamp(14px,2.5vw,32px)}
.cols>*{break-inside:avoid;margin-bottom:clamp(14px,2.5vw,32px)}
.about{display:grid;grid-template-columns:1fr minmax(180px,260px);gap:clamp(32px,6vw,96px);align-items:start}
@media (max-width:700px){.about{grid-template-columns:1fr}}
.ct{display:grid;gap:28px}
.ct .meta{margin-bottom:6px}
footer{padding-block:0 40px;display:flex;gap:12px 24px;flex-wrap:wrap;justify-content:space-between;color:var(--mute);font-size:12px}
footer div{display:flex;gap:20px}
footer a:hover{color:var(--ink)}
@media (max-width:700px){
:root{--pad:24px}
.bar{flex-wrap:nowrap;padding-block:28px 8px}
.logo{position:relative;z-index:50;font:400 17px/1 var(--serif);letter-spacing:0}
#lg{display:none}
#mb{display:block;position:relative;z-index:50;width:35px;height:26px;padding:0}
#mb::before,#mb::after{content:"";position:absolute;inset-inline:0;height:1px;background:var(--ink);transition:transform .25s,top .25s}
#mb::before{top:6px}
#mb::after{top:19px}
#mb[aria-expanded="true"]::before{top:12px;transform:rotate(45deg)}
#mb[aria-expanded="true"]::after{top:12px;transform:rotate(-45deg)}
nav{display:none}
nav.show{display:flex;position:fixed;inset:0;z-index:40;background:var(--bg);align-items:center;justify-content:center;padding:80px 24px}
nav ul{flex-direction:column;align-items:center;gap:0;text-align:center}
nav a{display:block;padding:0;font:400 clamp(26px,8vw,34px)/1.95 var(--serif);color:var(--ink)}
.lgm{display:block}
.lgm button{font:400 15px/1 var(--sans);color:var(--mute);margin-top:28px;padding:8px}
main{padding-top:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#vw{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center}
#vw[hidden]{display:none}
#vc{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#vc img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
#vw button{position:absolute;width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#vx{top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline-end:14px}
#vp{top:50%;margin-top:-23px;inset-inline-start:12px}
#vn{top:50%;margin-top:-23px;inset-inline-end:12px}
</style>
</head>
